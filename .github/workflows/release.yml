name: Release Audience Live

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check synchronized versions
        run: npm run version:check

      - name: Match version to release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^app-v', ''
          npm run version:check -- $tagVersion

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run JavaScript tests
        run: npm test

      # tauri-build checks that every externalBin exists, so the Rust tests need the sidecar too.
      - name: Build sidecar
        run: npm run build:sidecar

      - name: Run Rust tests
        run: npm run test:rust

      - name: Build and publish signed updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Audience Live v__VERSION__
          releaseBody: |
            FlagCount heißt jetzt Audience Live. Einstellungen und Lizenzen bleiben erhalten.
            Weitere Änderungen stehen im Update-Hinweis der App.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
