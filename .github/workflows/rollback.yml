name: Rollback

# Vorlage: hetzner/github-actions-templates/rollback.yml
# Bedienung: Actions -> Rollback -> Run workflow -> vollen git-SHA eintragen.
# Zurueck auf den aktuellen Stand: "latest" eintragen.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Voller git-SHA (40 Zeichen) eines zuvor funktionierenden Builds, oder "latest"'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Roll back to an immutable image
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG_INPUT
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/apps/flaggcount

            echo "$IMAGE_TAG_INPUT" | grep -Eq '^([0-9a-f]{40}|latest)$' \
              || { echo "Ungueltig: voller 40-stelliger git-SHA oder 'latest' erwartet"; exit 1; }

            # IMAGE_TAG persistent in .env schreiben, damit ein manuelles
            # "docker compose up -d" nicht unbemerkt auf latest springt.
            touch .env
            sed -i '/^IMAGE_TAG=/d' .env
            if [ "$IMAGE_TAG_INPUT" != "latest" ]; then
              echo "IMAGE_TAG=$IMAGE_TAG_INPUT" >> .env
            fi

            docker compose config --quiet
            docker compose pull

            # Backend- und Web-Image tragen denselben git-SHA. Staende vor der Trennung in
            # proxy/web/server brauchen zusaetzlich die damalige docker-compose.yml.
            if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
              docker compose ps
              docker compose logs --no-color --tail=200 proxy web server
              exit 1
            fi

            curl -fsS -o /dev/null -w 'backend: %{http_code}\n' http://127.0.0.1:3016/healthz
            curl -fsS -o /dev/null -w 'web: %{http_code}\n' http://127.0.0.1:3016/health
            echo "Aktiver Tag: ${IMAGE_TAG_INPUT}"
