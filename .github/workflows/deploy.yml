name: Deploy App (GHCR)

# Vorlage: hetzner/github-actions-templates/deploy-ghcr.yml
# Server: host nginx -> web auf 127.0.0.1:3017 und Backend auf 127.0.0.1:3018

on:
  push:
    branches:
      - main

env:
  SERVER_IMAGE: ghcr.io/jona1502/flaggcount
  WEB_IMAGE: ghcr.io/jona1502/flaggcount-web

jobs:
  # Gate: ein roter Lint/Typecheck/Test stoppt den Deploy, bevor irgendetwas
  # gebaut oder auf den Server gebracht wird.
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_SUMMARY: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Ueberschrieben wird ausschliesslich docker-compose.yml -
      # .env, .env.web und das Daten-Volume bleiben unangetastet.
      - name: Copy Docker Compose configuration to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.SERVER_USER }}/apps/flaggcount
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/apps/flaggcount

            # Ein Rollback setzt IMAGE_TAG in .env. Bleibt das stehen, wuerde
            # dieser Deploy den alten Stand erneut ziehen statt den neuen.
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              echo "IMAGE_TAG aus vorherigem Rollback gefunden - wird entfernt:"
              grep '^IMAGE_TAG=' .env
              sed -i '/^IMAGE_TAG=/d' .env
            fi

            docker compose config --quiet
            docker compose pull

            # --wait bricht ab, wenn ein neuer Container nicht healthy wird.
            if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
              docker compose ps
              docker compose logs --no-color --tail=200 web server db
              exit 1
            fi

            docker image prune -f

            curl -fsS -o /dev/null -w 'backend: %{http_code}\n' http://127.0.0.1:3018/healthz
            curl -fsS -o /dev/null -w 'web: %{http_code}\n' http://127.0.0.1:3017/health
