name: Deploy App (GHCR)

# Vorlage: hetzner/github-actions-templates/deploy-ghcr.yml
# Server: /home/jona/apps/flaggcount, Host-Port 3016, Domain overlay.muhrindustries.com

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/jona1502/flaggcount

jobs:
  # Gate: ein roter Typecheck/Test stoppt den Deploy, bevor irgendetwas
  # gebaut oder auf den Server gebracht wird.
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_SUMMARY: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Ueberschrieben wird ausschliesslich docker-compose.yml -
      # .env und das Daten-Volume bleiben unangetastet.
      - name: Copy Docker Compose configuration to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.SERVER_USER }}/apps/flaggcount
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.SERVER_USER }}/apps/flaggcount

            # Ein Rollback setzt IMAGE_TAG in .env. Bleibt das stehen, wuerde
            # dieser Deploy den alten Stand erneut ziehen statt den neuen.
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              echo "IMAGE_TAG aus vorherigem Rollback gefunden - wird entfernt:"
              grep '^IMAGE_TAG=' .env
              sed -i '/^IMAGE_TAG=/d' .env
            fi

            docker compose config --quiet
            docker compose pull

            # --wait bricht ab, wenn der neue Container nicht healthy wird.
            if ! docker compose up -d --wait --wait-timeout 180; then
              docker compose ps
              docker compose logs --no-color --tail=200 web
              cid="$(docker compose ps -q web)"
              docker inspect --format='health={{json .State.Health}}' "$cid" || true
              exit 1
            fi

            docker image prune -f

            # /healthz braucht keine Anmeldung und prueft nur, ob der Server antwortet.
            curl -fsS -o /dev/null -w 'origin: %{http_code}\n' http://127.0.0.1:3016/healthz
