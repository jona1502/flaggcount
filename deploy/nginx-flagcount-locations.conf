# Include these locations inside the existing HTTPS server block for overlay.muhrindustries.com.
# Next.js: 127.0.0.1:3017; FlagCount backend: 127.0.0.1:3018.

location ~ ^/(api(?:/|$)|overlay(?:/|$)|o/|ob/|healthz$|readyz$|download$) {
    proxy_pass http://127.0.0.1:3018;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for SSE; harmless for ordinary API responses.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location / {
    proxy_pass http://127.0.0.1:3017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
