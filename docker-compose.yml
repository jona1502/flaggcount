# FlagCount in production: host nginx routes directly to Next.js and the backend (see docs/WEB_ROUTING.md).
# Both ports bind to loopback only. The server keeps its secrets in .env; the web container reads the optional
# .env.web, which must not contain backend secrets.
services:
  web:
    image: ghcr.io/jona1502/flaggcount-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3017:3000"
    env_file:
      - path: .env.web
        required: false
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://server:3010
      # Admin credentials may live in the deployment .env; .env.web can override/add other web-only settings.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORT: ${ADMIN_PASSWORT:-}
      ADMIN_ASSERTION_SECRET: ${ADMIN_ASSERTION_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://overlay.muhrindustries.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  server:
    image: ghcr.io/jona1502/flaggcount:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3018:3010"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3010"
    volumes:
      - flaggcount_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3010/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  flaggcount_data:
