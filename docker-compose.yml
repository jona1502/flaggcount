services:
  web:
    image: ghcr.io/jona1502/flaggcount:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3016:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - flaggcount_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  flaggcount_data:
