# Nur für die lokale Entwicklung des Lizenzdienstes, nicht für den Server.
# Starten:  docker compose -f docker-compose.dev.yml up -d
# Dann z. B. DATABASE_URL=postgres://flagcount:flagcount-dev@127.0.0.1:5432/flagcount
# Tests gegen die Datenbank: TEST_DATABASE_URL=postgres://flagcount:flagcount-dev@127.0.0.1:5432/flagcount_test npm test
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flagcount
      POSTGRES_PASSWORD: flagcount-dev
      POSTGRES_DB: flagcount
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flagcount_dev_postgres:/var/lib/postgresql/data
      - ./scripts/dev-database.sql:/docker-entrypoint-initdb.d/dev-database.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flagcount"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flagcount_dev_postgres:
