[package]
name = "flagcount"
version = "0.1.0"
description = "Zählt rote Flaggen im TikTok-Live-Chat"
authors = ["jona1502"]
edition = "2021"

[lib]
name = "flagcount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3"
