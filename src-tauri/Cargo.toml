[package]
name = "flagcount"
version = "0.5.0"
description = "Zählt rote Flaggen im TikTok-Live-Chat"
authors = ["jona1502"]
edition = "2021"

[lib]
name = "flagcount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11", features = [] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-log = "2.9"
tauri-plugin-shell = "2.3"
tauri-plugin-store = "2.4"

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }

[target.'cfg(windows)'.dependencies]
# The activation secret of FlagCount Pro lives in the Windows Credential Manager.
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
